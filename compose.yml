services:
  database:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=resume_analyzer
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=resume_db
    restart: on-failure
    container_name: resume_container
    volumes:
      - resume_volume:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_analyzer -d resume_db"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  
  redis:
    image: redis:7-alpine
    container_name: redis_resume_container
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=myredispassword
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory-policy noeviction"]
    volumes:
      - redis_resume_volume:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  resume_volume:
    name: resume_volume
  redis_resume_volume:
    name: redis_resume_volume